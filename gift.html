<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#14000c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Your Secret Gift</title>

    <!-- Social Media Link Preview (Prevents Text Spoilers on Instagram, WhatsApp, etc.) -->
    <meta name="description" content="A special gift awaits... 🎁💖" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Secret Gift" />
    <meta property="og:description" content="A special gift awaits... 🎁💖" />
    <meta property="og:image" content="images/photo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Secret Gift" />
    <meta name="twitter:description" content="A special gift awaits... 🎁💖" />
    <meta name="twitter:image" content="images/photo.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="gift.css" />
  </head>
  <body>
    <!-- Password Screen -->
    <div id="password-screen">
      <div class="password-card">
        <h1>Secret Access</h1>
        <p>Only the birthday girl knows the password...</p>
        <div class="input-group">
          <input
            type="password"
            id="password-input"
            placeholder="Enter Password"
          />
          <button id="unlock-btn">Unlock</button>
        </div>
        <p id="error-msg" class="hidden">Incorrect password</p>
      </div>
    </div>

    <!-- Main Gift Content -->
    <div id="gift-content" class="hidden">
      <header>
        <h1 class="gift-title">Scratch to Reveal!</h1>
        <p class="gift-subtitle">Use your finger to reveal.</p>
      </header>

      <div id="scratch-container">
        <!-- Scratch cards will be generated by JS -->
      </div>
    </div>

    <footer>
      <p>Created with 🖤 by Dark</p>
    </footer>

    <script src="gift.js"></script>
  </body>
</html>
